name: Refresh data

# Run daily at 8am UTC, or trigger manually from the Actions tab
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 1. Install backend deps (cached) ──────────────────────────────────
      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-deps-${{ hashFiles('backend/package-lock.json') }}

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      # ── 2. Refresh StatsCan data → MySQL ───────────────────────────────────
      # Daily: unemployment, CPI food, rent CPI, housing starts (monthly releases)
      # Monday only: GDP, population, CSI, homicide, fiscal, NHPI (annual/quarterly)
      - name: Refresh StatsCan data
        run: node refresh-statscan.js
        working-directory: backend
        env:
          MYSQL_HOST:     ${{ secrets.MYSQL_HOST }}
          MYSQL_USER:     ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        continue-on-error: true

      # ── 3. Generate scored JSON from MySQL ─────────────────────────────────
      - name: Snapshot data before generation
        run: |
          cp api/data.json /tmp/data-before.json 2>/dev/null || true
          cp api/cities.json /tmp/cities-before.json 2>/dev/null || true
          cp api/mps.json /tmp/mps-before.json 2>/dev/null || true

      - name: Generate all data
        run: node generate-all.js
        working-directory: backend
        env:
          MYSQL_HOST:     ${{ secrets.MYSQL_HOST }}
          MYSQL_USER:     ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}

      # ── 4. Detect if scores actually changed ──────────────────────────────
      - name: Check for score changes
        id: changes
        run: |
          # Compare scores (ignore lastUpdated timestamp which always changes)
          changed=false
          for f in data.json cities.json mps.json; do
            if [ -f "/tmp/${f%.*}-before.${f##*.}" ]; then
              # Strip lastUpdated and compare
              before=$(cat "/tmp/${f%.*}-before.${f##*.}" | python3 -c "import json,sys; d=json.load(sys.stdin); d.pop('lastUpdated',None); print(json.dumps(d,sort_keys=True))" 2>/dev/null | md5sum)
              after=$(cat "api/$f" | python3 -c "import json,sys; d=json.load(sys.stdin); d.pop('lastUpdated',None); print(json.dumps(d,sort_keys=True))" 2>/dev/null | md5sum)
              if [ "$before" != "$after" ]; then
                echo "✓ $f: scores changed"
                changed=true
              else
                echo "· $f: unchanged"
              fi
            else
              echo "✓ $f: no baseline (first run)"
              changed=true
            fi
          done
          echo "data_changed=$changed" >> $GITHUB_OUTPUT

      # ── 5. Conditional: only run expensive steps if scores changed ────────
      - name: Save score snapshot
        if: steps.changes.outputs.data_changed == 'true'
        run: node save-snapshot.js
        working-directory: backend
        env:
          MYSQL_HOST:     ${{ secrets.MYSQL_HOST }}
          MYSQL_USER:     ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}

      - name: Generate PDF reports
        if: steps.changes.outputs.data_changed == 'true'
        run: node generate-reports.js
        working-directory: backend

      - name: Generate sitemap
        if: steps.changes.outputs.data_changed == 'true'
        run: node generate-sitemap.js
        working-directory: backend

      # ── 6. Build frontends (only if scores changed) ───────────────────────
      - name: Cache frontend node_modules
        if: steps.changes.outputs.data_changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            cities/node_modules
            mps/node_modules
          key: frontend-deps-${{ hashFiles('frontend/package-lock.json', 'cities/package-lock.json', 'mps/package-lock.json') }}

      - name: Build provinces
        if: steps.changes.outputs.data_changed == 'true'
        run: cd frontend && npm ci && npm run build
        env:
          VITE_API_URL: ''
          VITE_BASE_PATH: /provinces/

      - name: Build cities
        if: steps.changes.outputs.data_changed == 'true'
        run: cd cities && npm ci && npm run build
        env:
          VITE_API_URL: ''

      - name: Build MPs
        if: steps.changes.outputs.data_changed == 'true'
        run: cd mps && npm ci && npm run build
        env:
          VITE_API_URL: ''

      # ── 7. Commit and deploy ──────────────────────────────────────────────
      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f api/data.json api/cities.json api/mps.json api/riding-spending.json
          git add -f portal/sitemap.xml portal/robots.txt
          git add -f frontend/dist/ cities/dist/ mps/dist/
          git add -f frontend/src/data/fallback.json
          git add -f reports/
          git diff --staged --quiet && echo "No changes — skipping commit" && exit 0
          git commit -m "chore: refresh data $(date -u +'%Y-%m-%d') [skip ci]"
          git pull --rebase --autostash origin main || true
          if grep -rl '<<<<<<< ' api/ frontend/src/data/ 2>/dev/null; then
            echo "ERROR: merge conflict markers — aborting"
            git rebase --abort 2>/dev/null
            exit 1
          fi
          git push

      - name: Deploy to cPanel
        if: steps.changes.outputs.data_changed == 'true'
        run: |
          curl -s -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://seanwood.com:2083/execute/VersionControl/update?repository_root=/home/seanw2/repositories/provincial-scorecard&branch=main" \
            -o /dev/null -w "cPanel update: HTTP %{http_code}\n"
          sleep 5
          curl -s -H "Authorization: cpanel ${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_API_TOKEN }}" \
            "https://seanwood.com:2083/execute/VersionControlDeployment/create?repository_root=/home/seanw2/repositories/provincial-scorecard" \
            -o /dev/null -w "cPanel update: HTTP %{http_code}\n"
