---
deployment:
  tasks:
    - export DEPLOYPATH=/home/seanw2/public_html/nonpartisangovernance.ca
    # API (JSON data files only — frontends deployed separately via SSH)
    - /bin/mkdir -p $DEPLOYPATH/api
    - /bin/cp api/*.json $DEPLOYPATH/api/ 2>/dev/null; true
    - /bin/cp api/*.php $DEPLOYPATH/api/
    - /bin/cp api/.htaccess $DEPLOYPATH/api/
    # Reports (PDFs — served via api/download.php)
    - /bin/mkdir -p $DEPLOYPATH/reports/ridings
    - /bin/cp -R reports/ridings/* $DEPLOYPATH/reports/ridings/ 2>/dev/null; true
